version: '3.8'

services:
  backend:
    build: ./backend
    container_name: contract-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/contracts.db:/app/contracts.db
    environment:
      - DATABASE_URL=sqlite:///./contracts.db
      - SECRET_KEY=your-secret-key-change-in-production
    restart: always
    networks:
      - contract-network

  frontend:
    build: ./frontend
    container_name: contract-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - contract-network

networks:
  contract-network:
    driver: bridge
